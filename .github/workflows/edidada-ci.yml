name: edidada CI (MiniOB)

on:
  push:
    branches:
      - edidada/main
  workflow_dispatch:

jobs:
  build:
    name: build + unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 lld-15 cmake ninja-build \
            libevent-dev libjsoncpp-dev libgtest-dev python3

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-15 \
            -DCMAKE_CXX_COMPILER=clang++-15 \
            -DWITH_UNIT_TESTS=ON \
            -DCMAKE_COMMON_FLAGS="-I/usr/include/jsoncpp -I/usr/include/event2"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -j4

      - name: Inspect observer linkage
        run: |
          ls -l build/bin
          file build/bin/observer
          ldd build/bin/observer || true

      - name: Smoke start observer
        run: |
          mkdir -p /tmp/obdata && cd /tmp/obdata
          "$GITHUB_WORKSPACE/build/bin/observer" -f "$GITHUB_WORKSPACE/etc/observer.ini" -s /tmp/ob.sock &
          sleep 5
          ls -l /tmp/ob.sock || true
          (echo "create table t1(id int);"; sleep 1; echo "exit") | "$GITHUB_WORKSPACE/build/bin/obclient" -s /tmp/ob.sock || true
          kill %1 || true

      - name: Repro crash under gdb
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y gdb
          mkdir -p /tmp/gdbdata && cd /tmp/gdbdata
          cat > /tmp/repro.sql <<'SQL'
          create table t_basic(id int, age int, name char, score float);
          insert into t_basic values(1,1, 'a', 1.0);
          insert into t_basic values(2,2, 'b', 2.0);
          select * from t_basic;
          delete from t_basic where id=3;
          select * from t_basic where id=1;
          update t_basic set age=10 where id=2;
          select * from t_basic where id=2;
          create index i_id on t_basic (id);
          select * from t_basic;
          SQL
          gdb -batch -ex "set pagination off" -ex run -ex "bt 25" -ex "info registers rip" \
              --args "$GITHUB_WORKSPACE/build/bin/observer" -f "$GITHUB_WORKSPACE/etc/observer.ini" -s /tmp/gdb.sock > /tmp/gdb.log 2>&1 &
          for i in $(seq 1 30); do [ -S /tmp/gdb.sock ] && break; sleep 1; done
          "$GITHUB_WORKSPACE/build/bin/obclient" -s /tmp/gdb.sock < /tmp/repro.sql || true
          sleep 3
          pkill -f 'observer -f' || true
          sleep 1
          tail -n 60 /tmp/gdb.log

      - name: Upload observer
        uses: actions/upload-artifact@v4
        with:
          name: observer
          path: |
            build/bin
            build/lib
          retention-days: 3

  cases:
    name: primary case suite
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download observer
        uses: actions/download-artifact@v4
        with:
          name: observer
          path: build

      - name: Install runtime libs
        run: sudo apt-get update && sudo apt-get install -y python3 libevent-dev libjsoncpp-dev

      - name: Restore exec bits
        run: chmod +x build/bin/*

      - name: Run case suite
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
        run: |
          failed=""
          for c in basic primary-select-tables primary-select-meta primary-insert primary-update \
                   primary-date primary-aggregation-func primary-drop-table primary-null primary-unique \
                   primary-multi-index primary-text primary-expression primary-order-by primary-group-by \
                   primary-join-tables primary-simple-sub-query primary-complex-sub-query; do
            echo "::group::case $c"
            python3 test/case/miniob_test.py \
              --test-case-dir=test/case/test \
              --test-result-dir=test/case/result \
              --test-case-scores=test/case/case-scores.json \
              --db-base-dir="$GITHUB_WORKSPACE/build" \
              --db-config="$GITHUB_WORKSPACE/etc/observer.ini" \
              --db-data-dir="data_$c" \
              --use-unix-socket --log=stdout --code-type=none \
              --test-cases=$c > "case_$c.log" 2>&1 || true
            tail -n 20 "case_$c.log"
            if grep -q 'Case failed' "case_$c.log"; then
              echo "case $c FAILED"
              failed="$failed $c"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failed cases:$failed"
            exit 1
          fi


