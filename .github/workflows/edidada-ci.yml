name: edidada CI (MiniOB)

on:
  push:
    branches:
      - edidada/main
  workflow_dispatch:

jobs:
  build-and-test:
    name: build + unit tests + primary cases
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 lld-15 cmake ninja-build \
            libevent-dev libjsoncpp-dev libgtest-dev python3

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-15 \
            -DCMAKE_CXX_COMPILER=clang++-15 \
            -DWITH_UNIT_TESTS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Show build artifacts
        run: ls -l build/bin

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -j4

      - name: "Case: basic"
        run: python3 test/case/miniob_test.py --test-case-dir=test/case/test --test-result-dir=test/case/result --test-case-scores=test/case/case-scores.json --db-base-dir="$GITHUB_WORKSPACE/build" --db-config="$GITHUB_WORKSPACE/etc/observer.ini" --db-data-dir=data_basic --use-unix-socket --log=stdout --test-cases=basic

      - name: "Case: primary-select-tables"
        run: python3 test/case/miniob_test.py --test-case-dir=test/case/test --test-result-dir=test/case/result --test-case-scores=test/case/case-scores.json --db-base-dir="$GITHUB_WORKSPACE/build" --db-config="$GITHUB_WORKSPACE/etc/observer.ini" --db-data-dir=data_sel_tables --use-unix-socket --log=stdout --test-cases=primary-select-tables

      - name: "Case: primary-select-meta"
