name: edidada CI (MiniOB)

on:
  push:
    branches:
      - edidada/main
  workflow_dispatch:

jobs:
  build:
    name: build + unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 lld-15 cmake ninja-build \
            libevent-dev libjsoncpp-dev libgtest-dev python3

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-15 \
            -DCMAKE_CXX_COMPILER=clang++-15 \
            -DWITH_UNIT_TESTS=ON \
            -DCMAKE_COMMON_FLAGS="-I/usr/include/jsoncpp -I/usr/include/event2"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -j4

      - name: Inspect observer linkage
        run: |
          ls -l build/bin
          file build/bin/observer
          ldd build/bin/observer || true

      - name: Smoke start observer
        run: |
          mkdir -p /tmp/obdata && cd /tmp/obdata
          "$GITHUB_WORKSPACE/build/bin/observer" -f "$GITHUB_WORKSPACE/etc/observer.ini" -s /tmp/ob.sock &
          sleep 5
          ls -l /tmp/ob.sock || true
          (echo "create table t1(id int);"; sleep 1; echo "exit") | "$GITHUB_WORKSPACE/build/bin/obclient" -s /tmp/ob.sock || true
          kill %1 || true

      - name: Upload observer
        uses: actions/upload-artifact@v4
        with:
          name: observer
          path: |
            build/bin
            build/lib
          retention-days: 3

  cases:
    name: "case: ${{ matrix.case }}"
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case:
          - basic
          - primary-select-tables
          - primary-select-meta
          - primary-insert
          - primary-update
          - primary-date
          - primary-aggregation-func
          - primary-drop-table
          - primary-null
          - primary-unique
          - primary-multi-index
          - primary-text
          - primary-expression
          - primary-order-by
          - primary-group-by
          - primary-join-tables
          - primary-simple-sub-query
          - primary-complex-sub-query

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download observer
        uses: actions/download-artifact@v4
        with:
          name: observer
          path: build

      - name: Install runtime libs
        run: sudo apt-get update && sudo apt-get install -y python3 libevent-dev libjsoncpp-dev

      - name: Restore exec bits
        run: chmod +x build/bin/*

      - name: Debug observer start
        run: |
          ls -l build/bin
          mkdir -p /tmp/dbgdata
          cd /tmp/dbgdata
          timeout 5 "$GITHUB_WORKSPACE/build/bin/observer" -f "$GITHUB_WORKSPACE/etc/observer.ini" -s /tmp/dbg.sock; echo "observer exit=$?"

      - name: Run case
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
        run: |
          set -o pipefail
          python3 test/case/miniob_test.py \
            --test-case-dir=test/case/test \
            --test-result-dir=test/case/result \
            --test-case-scores=test/case/case-scores.json \
            --db-base-dir="$GITHUB_WORKSPACE/build" \
            --db-config="$GITHUB_WORKSPACE/etc/observer.ini" \
            --db-data-dir="data_${{ matrix.case }}" \
            --use-unix-socket --log=stdout --code-type=none \
            --test-cases=${{ matrix.case }} | tee case.log
          if grep -q 'Case failed' case.log; then
            echo "case ${{ matrix.case }} FAILED"
            exit 1
          fi
